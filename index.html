<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic Pro</title><style>body{font:16px system-ui;background:#edf2f8;color:#18243a;margin:auto;max-width:900px;padding:24px}section{background:white;padding:24px;border-radius:16px;margin:16px 0}button{background:#2459bc;color:white;border:0;padding:12px;border-radius:8px;margin:4px;cursor:pointer}label{display:block;padding:12px;border:1px solid #ccd5e0;border-radius:8px;margin:8px 0;white-space:pre-wrap}h2{white-space:pre-wrap}progress{width:100%}</style><h1>Agentic Pro</h1><p>Google Professional Agentic Architect</p><section><p>本機匯入兩份 HTML（不會上傳題庫）</p><input id="files" type="file" multiple accept=".html,.htm"><p id="status"></p><select id="mode"><option value="practice">一般練習</option><option value="exam">模擬考試</option><option value="wrong">錯題本</option></select><label>題數 <input id="count" type="number" min="1" value="75"></label><label><input id="random" type="checkbox" checked> 隨機出題</label><label>考試分鐘 <input id="minutes" type="number" min="1" value="120"></label><button id="start">開始</button><button id="resume">繼續上次</button><button id="clear">清除資料</button></section><section id="quiz" hidden><p id="meta"></p><progress id="progress"></progress><h2 id="question"></h2><div id="options"></div><p id="feedback"></p><button id="prev">上一題</button><button id="check">確認答案</button><button id="next">下一題</button><button id="finish">交卷</button></section><section id="result" hidden></section><script>
const $=id=>document.getElementById(id),key='agentic-pro-v1';let db;try{db=JSON.parse(localStorage.getItem(key))||{bank:[],wrong:[],session:null}}catch{db={bank:[],wrong:[],session:null}}let s=null;function save(){try{localStorage.setItem(key,JSON.stringify(db))}catch{alert('本機儲存失敗')}}function status(){$('status').textContent='已匯入 '+db.bank.length+' 題；錯題 '+db.wrong.length+' 題';$('resume').disabled=!db.session}status();
$('files').onchange=async()=>{try{let map=new Map(db.bank.map(q=>[q.id,q]));for(const f of $('files').files){let doc=new DOMParser().parseFromString(await f.text(),'text/html');for(const card of doc.querySelectorAll('.exam-question-card')){let id=Number(card.querySelector('.card-header strong')?.textContent.match(/\d+/)?.[0]),p=card.querySelector('.question-body p.card-text');let opts=[...card.querySelectorAll('.multi-choice-item')].map(li=>{let letter=li.querySelector('[data-choice-letter]')?.dataset.choiceLetter,copy=li.cloneNode(true);copy.querySelector('.multi-choice-letter')?.remove();return {id:letter,text:copy.textContent.trim(),correct:[...li.attributes].some(a=>a.name.startsWith('data-correct'))}});let answers=opts.filter(o=>o.correct).map(o=>o.id);if(!id||!p||!answers.length||opts.some(o=>!o.id))throw Error('無法解析題目 '+id);let copy=p.cloneNode(true);copy.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));map.set(id,{id,text:copy.textContent.trim(),opts,answers})}}db.bank=[...map.values()].sort((a,b)=>a.id-b.id);save();status()}catch(e){$('status').textContent=e.message}};
$('start').onclick=()=>{let mode=$('mode').value,ids=db.bank.filter(q=>mode!=='wrong'||db.wrong.includes(q.id)).map(q=>q.id);if(!ids.length)return alert('請先匯入題庫或確認有錯題');if($('random').checked)for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}ids=ids.slice(0,Math.max(1,Number($('count').value)||75));s={ids,i:0,mode,answers:{},checked:{},end:Date.now()+Math.max(1,Number($('minutes').value)||120)*60000,done:false};db.session=s;save();render()};
$('resume').onclick=()=>{s=db.session;if(s)s.done?finish():render()};$('clear').onclick=()=>{if(confirm('清除所有本機資料？')){localStorage.removeItem(key);location.reload()}};function qnow(){return db.bank.find(q=>q.id===s.ids[s.i])}function correct(q){return JSON.stringify([...(s.answers[q.id]||[])].sort())===JSON.stringify([...q.answers].sort())}function record(q){if(correct(q))db.wrong=db.wrong.filter(id=>id!==q.id);else if(!db.wrong.includes(q.id))db.wrong.push(q.id)}
function render(){let q=qnow();if(!q)return;$('quiz').hidden=false;$('result').hidden=true;$('meta').textContent=(s.i+1)+' / '+s.ids.length+' · 原題 #'+q.id+' · '+(q.answers.length>1?'複選 '+q.answers.length+' 項':'單選');$('progress').max=s.ids.length;$('progress').value=s.i+1;$('question').textContent=q.text;$('options').replaceChildren();for(const o of q.opts){let l=document.createElement('label'),i=document.createElement('input');i.type=q.answers.length>1?'checkbox':'radio';i.name='answer';i.checked=(s.answers[q.id]||[]).includes(o.id);i.disabled=!!s.checked[q.id];i.onchange=()=>{let a=s.answers[q.id]||[];s.answers[q.id]=i.type==='radio'?[o.id]:i.checked?[...a,o.id]:a.filter(x=>x!==o.id);save()};l.append(i,document.createTextNode(' '+o.id+'. '+o.text));$('options').append(l)}$('feedback').textContent=s.checked[q.id]?(correct(q)?'回答正確':'回答錯誤')+'｜題庫答案：'+q.answers.join(', ')+'（來源答案，未獨立驗證）':'';$('check').hidden=s.mode==='exam';$('check').disabled=!!s.checked[q.id];$('prev').disabled=s.i===0;$('next').disabled=s.i===s.ids.length-1;save();status()}
$('check').onclick=()=>{let q=qnow();if(!(s.answers[q.id]||[]).length)return alert('請選擇答案');s.checked[q.id]=true;record(q);render()};$('prev').onclick=()=>{s.i--;render()};$('next').onclick=()=>{s.i++;render()};$('finish').onclick=()=>{if(confirm('確定交卷？'))finish()};function finish(){s.done=true;let qs=s.ids.map(id=>db.bank.find(q=>q.id===id)).filter(Boolean);qs.forEach(record);save();$('quiz').hidden=true;$('result').hidden=false;$('result').replaceChildren();let h=document.createElement('h2');h.textContent='成績 '+qs.filter(correct).length+' / '+qs.length;$('result').append(h);for(const q of qs){let p=document.createElement('p');p.textContent='#'+q.id+' '+(correct(q)?'正確':'錯誤')+'｜你的答案：'+(s.answers[q.id]||[]).join(', ')+'｜題庫答案：'+q.answers.join(', ');$('result').append(p)}status()}setInterval(()=>{if(s&&!s.done&&s.mode==='exam'){let t=Math.max(0,Math.ceil((s.end-Date.now())/1000));$('meta').textContent=(s.i+1)+' / '+s.ids.length+' · 原題 #'+qnow().id+' · 剩餘 '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(!t)finish()}},1000);
</script></html>
