ock harmful content, and sanitize personally identifiable information (PII) before responses reach the user interface. You need to implement a managed security enforcement layer that meets these requirements with minimal latency. What should you do?","opts":[{"id":"A","text":"Apply a Sensitive Data Protection de-identification template at the Agent Gateway, and filter for injection and harmful content using Model Armor’s input and output templates","correct":false},{"id":"B","text":"Enforce Model Armor filter templates with linked Sensitive Data Protection de-identification templates at the Agent Gateway for all agent traffic.","correct":true},{"id":"C","text":"Deploy a custom Llama Guard model on Model Garden behind the Agent Gateway, and add a Sensitive Data Protection inspection template for PII.","correct":false},{"id":"D","text":"Configure Model Armor filter templates with linked Sensitive Data Protection de-identification templates, and attach them to each agent’s runtime.","correct":false}],"answers":["B"]},{"id":63,"text":"You are implementing an agent built using Agent Development Kit (ADK) that is deployed in Google Kubernetes Engine (GKE). The agent automatically generates and executes Python data analysis scripts based on user-provided datasets. You want to ensure that the AI-generated code is executed safely, preventing any potential malicious code from accessing the internet, exfiltrating data, or reading the host system’s environment variables.\n\nYou need to implement a deterministic, infrastructure-level boundary specifically for the code execution phase without breaking the agent’s primary reasoning loop. What should you do?","opts":[{"id":"A","text":"Update the agent’s system prompt with explicit system instructions forbidding the LLM from generating code that imports external network libraries or reads local variables.","correct":false},{"id":"B","text":"Wrap the agent’s deployment in a VPC Service Controls perimeter, and configure an egress rule that drops all outbound internet traffic from the agent’s service account.","correct":false},{"id":"C","text":"Configure the ADK agent to route all generated scripts to a managed execution sandbox.","correct":true},{"id":"D","text":"Configure a Model Armor policy with a custom Sensitive Data Protection dictionary to scan and block any Python network or OS library imports in the agent’s generated code.","correct":false}],"answers":["C"]},{"id":64,"text":"You are deploying an agent on Gemini Enterprise Agent Platform in a dedicated runtime Google Cloud project, Project-A. The agent needs to retrieve database API credentials from Secret Manager in a centralized governance project, Project-B, and query an Agent Search data store also hosted in Project-B. You are using Agent Identity to govern the agent’s permissions across projects. You need to grant the minimum required cross-project IAM access while adhering to the principle of least privilege. What should you do? (Choose two.)","opts":[{"id":"A","text":"Grant the roles/secretmanager.user IAM role to the agent’s identity at the Project-B project level.","correct":false},{"id":"B","text":"Grant the roles/secretmanager.secretAccessor IAM role to the agent’s identity scoped to the database resource in Project-B.","correct":true},{"id":"C","text":"Grant the roles/discoveryengine.editor IAM role to Project-A’s agent identity at the Project-B project level.","correct":false},{"id":"D","text":"Grant the roles/discoveryengine.viewer IAM role to the agent’s identity scoped to the target Agent Search data store resource in Project-B.","correct":true},{"id":"E","text":"Grant the roles/iam.serviceAccountTokenCreator IAM role to Project-B’s agent identity to allow cross-project impersonation.","correct":false}],"answers":["B","D"]},{"id":65,"text":"You are architecting an enterprise agentic platform that connects autonomous agents to internal managed databases, custom API endpoints, and third-party software-as-a-service (SaaS) integrations. Individual product teams build redundant integration adapters and connect to remote services, leading to fragmented security boundaries and high maintenance overhead. You need to implement a unified architecture to standardize these integrations securely. What should you do?","opts":[{"id":"A","text":"•Deploy MCP servers for data and API access.\n•Register API endpoints in Cloud API Gateway using OpenAPI specifications.\n•Enforce VPC Service Controls perimeters.","correct":false},{"id":"B","text":"•Deploy MCP servers hosted alongside each agent instance.\n•Store the configuration manifests in Artifact Registry.\n•Grant the Service Account User IAM role to the agent identities.","correct":false},{"id":"C","text":"•Deploy MCP servers for each external service.\n•Index the endpoints in Agent Search data stores for dynamic agent discovery.\n•Manage tool access using the Restrict Resource Service Usage constraint.","correct":false},{"id":"D","text":"•Deploy MCP servers for data and API access.\n•Register custom endpoints using Agent Registry Service resources.\n•Enforce authorization using IAM policies and Model Armor floor settings.","correct":true}],"answers":["D"]},{"id":66,"text":"You are architecting an agentic workflow on Google Cloud for a healthcare enterprise that processes strict HIPAA-regulated protected health information (PHI). Your organization’s security policy prohibits sending PHI over public software-as-a-service (SaaS) internet endpoints and mandates full data isolation, customer-managed encryption, and strict data residency. You need to select and deploy language models that support agentic tool calling while complying with these data sovereignty requirements. What should you do? (Choose two.)","opts":[{"id":"A","text":"Self-host a fine-tuned open-weights model on Cloud Run using default private endpoints with IAM user authentication.","correct":false},{"id":"B","text":"Deploy a self-hosted LLM through a HTTP webhook using public internet routing and TLS 1.3 encryption.","correct":false},{"id":"C","text":"Use the private Gemini API with standard API keys and rely on client-side prompt obfuscation to anonymize patient health records.","correct":false},{"id":"D","text":"Use managed Gemini endpoints configured with customer-managed encryption keys and Private Service Connect within your Google Cloud compliance perimeter.","correct":true},{"id":"E","text":"Deploy the latest Gemma model using vLLM on a Google Kubernetes Engine (GKE) cluster with Private Service Connect in an air-gapped VPC.","correct":true}],"answers":["D","E"]},{"id":67,"text":"You are configuring a custom agent in Gemini Enterprise that uses a dedicated service account to query an Agent Search data store. During testing, grounded search queries fail with a 403 Permission Denied error stating that the principal lacks the discoveryengine.servingConfigs.search permission on the data store resource. You need to resolve this permission error while adhering to the principle of least privilege. What should you do?","opts":[{"id":"A","text":"Grant the roles/discoveryengine.editor IAM role to the agent’s service account on the Google Cloud project hosting the data store.","correct":false},{"id":"B","text":"Grant the roles/discoveryengine.agentspaceAdmin IAM role to the agent’s service account on the target Gemini Enterprise app.","correct":false},{"id":"C","text":"Grant the roles/discoveryengine.viewer IAM role to the agent’s service account on the data store resource.","correct":true},{"id":"D","text":"Grant the roles/storage.objectViewer IAM role to the agent’s service account on a Cloud Storage bucket containing the original source documents.","correct":false}],"answers":["C"]},{"id":68,"text":"You are configuring a secure agent-to-tool API integration for a financial agent on Gemini Enterprise Agent Platform. The agent invokes an internal payment processing microservice that enforces OAuth 2.0 protection. To comply with strict enterprise security policy, you must ensure that:\n\n1. OAuth client credentials used for service-to-service tool authentication are encrypted at rest and never hardcoded in tool definitions or repository source code.\n\n2. Tool execution is strictly constrained to minimum required API permissions, so the agent cannot perform unauthorized administrative operations on the payment microservice.\n\nWhat should you do? (Choose two.)","opts":[{"id":"A","text":"Grant the roles/owner IAM role on the payment microservice project to the agent’s identity.","correct":false},{"id":"B","text":"Define explicit OAuth scopes such as payments.read and payments.create in the auth provider definition, and bind the provider to the specific payment tool definition in Agent Runtime.","correct":true},{"id":"C","text":"Encode the OAuth client secret in Base64, and pass the secret in the tools.py environment variable map.","correct":false},{"id":"D","text":"Configure the tool definition to use OAUTH2_IMPLICIT_GRANT with wildcard scopes (*).","correct":false},{"id":"E","text":"Store the OAuth client credentials in Secret Manager, and reference the Secret Manager resource URI within the Agent Identity auth manager provider configuration.","correct":true}],"answers":["B","E"]},{"id":69,"text":"You are configuring enterprise agents that need to dynamically discover and invoke capabilities across managed databases, third-party SaaS tools, and Google Cloud services. Your architecture hosts custom MCP servers on Cloud Run alongside pre-built Google Cloud MCP servers. Your operations team requires a centralized catalog to govern access controls, register JSON tool specifications, and manage IAM identities across all remote HTTP transport endpoints.\n\nYou need to maximize operational efficiency and maintain strict governance by establishing a single point of discovery and access control for both native and custom agent capabilities. What should you do?","opts":[{"id":"A","text":"Register custom Cloud Run MCP servers as Service resources within Agent Registry, upload their JSON tool specifications, and enable built-in Google Cloud MCP servers to centralize agent capability discovery and IAM access governance.","correct":true},{"id":"B","text":"Store local client configuration files containing remote HTTP endpoints in Secret Manager, and mount them across agent execution environments to handle tool discovery and endpoint authentication.","correct":false},{"id":"C","text":"Deploy OpenAPI specifications for custom Cloud Run MCP servers using Cloud Endpoints, and register these endpoints in Service Directory to enable dynamic agent service discovery and endpoint-level IAM security.","correct":false},{"id":"D","text":"Configure custom MCP servers on Cloud Run, and grant granular IAM roles to extension service accounts to manage agent access controls within defined VPC Service Controls perimeters.","correct":false}],"answers":["A"]},{"id":70,"text":"You are architecting an autonomous payment processing multiagent system on Agent Runtime in Google Cloud. The system includes an orchestrator agent that delegates corporate transaction instructions to specialized banking execution tools. Safety governance policies mandate that transactions exceeding a defined threshold must be intercepted and receive approval from an authorized compliance officer before tool invocation. You need to configure a safety control mechanism that fulfills this requirement with minimal operational complexity. What should you do?","opts":[{"id":"A","text":"Configure Cloud Tasks queues with rate limiting to delay tool calls, and execute Cloud Run functions to poll a database for approval status.","correct":false},{"id":"B","text":"Configure approval breakpoints on banking tool definitions, and enable managed sessions to persist execution state until resumed using callback.","correct":true},{"id":"C","text":"Configure a Cloud Run function as an execution wrapper around all banking tools, and implement an approval tracking database.","correct":false},{"id":"D","text":"Configure Pub/Sub message topics to buffer transaction payloads, and deploy Cloud Run functions to process approval tokens.","correct":false}],"answers":["B"]},{"id":71,"text":"You are deploying a custom Antigravity CLI plugin to enforce enterprise data loss prevention compliance across developer workstations. You need to configure an event hook that intercepts tool calls right before file execution, automatically redacts sensitive API keys from generated code diffs in transit, and halts tool execution if sanitization fails. What should you do?","opts":[{"id":"A","text":"Define an Inspect hook in a hooks.json file bound to the pre-tool execution event, and implement a handler function that reads the payload and rewrites the parameters before returning a success status.","correct":false},{"id":"B","text":"Define a Decide hook in a hooks.json file bound to the pre-tool execution event, and implement a handler function that evaluates policy rules and modifies sensitive text strings in-place.","correct":false},{"id":"C","text":"Define a postToolUse hook in a hooks.json file bound to the post-tool execution event, and implement an asynchronous handler function that cleans the modified file on disk after execution completes.","correct":false},{"id":"D","text":"Define a Transform hook in a hooks.json file bound to the pre-tool execution event, and implement a handler function that mutates the payload parameter stream before returning it to the execution context.","correct":true}],"answers":["D"]},{"id":72,"text":"You are deploying a data analysis agent using a dedicated agent identity. The agent requires access to a specific Cloud Storage bucket containing financial data in the same project as the agent. You need to ensure that agent identity cannot access any other storage buckets, even if overly permissive project-wide IAM roles are accidentally granted. What should you do?","opts":[{"id":"A","text":"Apply IAM Conditions to the agent identity’s IAM policy bindings, and restrict storage.objects.* permissions to resource names matching the designated financial bucket.","correct":false},{"id":"B","text":"Configure a VPC Service Controls perimeter around the storage project, and define an ingress policy that permits Cloud Storage API operations only when invoked by the specific agent identity principal.","correct":false},{"id":"C","text":"Attach a principal access boundary (PAB) IAM policy to the agent identity that provides access to only the required storage bucket.","correct":true},{"id":"D","text":"Configure an IAM Deny policy on the organization node to block all service accounts from accessing the storage buckets.","correct":false}],"answers":["C"]},{"id":73,"text":"You are establishing security and monitoring controls on Agent Gateway for an enterprise financial agent. The agent invokes external third-party partner APIs through Agent Gateway. You need to configure Agent Gateway to enforce the following policies:\n\n1. Outbound traffic passing through Agent Gateway must be continuously inspected to detect and block unintentional exfiltration of sensitive data in tool payloads.\n\n2. Egress traffic metrics, including per-agent token usage, request latency, and HTTP response codes, must be aggregated in real time for centralized security monitoring and cost allocation.\n\nWhat should you do? (Choose two.)","opts":[{"id":"A","text":"Configure the Agent Gateway ingress route to disable TLS decryption.","correct":false},{"id":"B","text":"Enable telemetry exporters on Agent Gateway routes to stream structured request logs, latency metrics, traces, and usage metadata to Cloud Logging and BigQuery.","correct":true},{"id":"C","text":"Attach a Sensitive Data Protection inspection filter to Agent Gateway egress routes to scan and sanitize request payload contents before forwarding them to third-party endpoints.","correct":true},{"id":"D","text":"Deploy an in-container eviction hook in the third-party partner API server to push telemetry metrics back to Agent Gateway.","correct":false},{"id":"E","text":"Configure a VPC Service Controls perimeter around external third-party API private IP addresses to perform deep packet inspection and sanitization on egress HTTPS traffic.","correct":false}],"answers":["B","C"]},{"id":74,"text":"You are architecting a multiagent system on Google Cloud where multiple autonomous agents deployed in Agent Runtime collaborate using a graph workflow and pass context along sequential task routes. You want to ensure that each agent operates with least privilege access, and its specific actions can be traced independently. What should you do?","opts":[{"id":"A","text":"Create a unique agent identity for each agent in Agent Runtime, register the agents in the Agent Registry, and grant the agent identity principal the necessary IAM roles for specific endpoints.","correct":true},{"id":"B","text":"Use Agent Development Kit (ADK) local session state using the ToolContext parameter to dynamically store and propagate user authorization credentials in memory.","correct":false},{"id":"C","text":"Configure a dedicated service account for each agent in Agent Runtime, grant least-privilege IAM roles to each service account for target resources, and use standard Cloud Audit Logs for auditability.","correct":false},{"id":"D","text":"Store API keys in Secret Manager, and enable agents to retrieve keys to authorize communications.","correct":false}],"answers":["A"]},{"id":75,"text":"You are designing authentication controls for an Agent Development Kit (ADK) agent on Gemini Enterprise Agent Platform that queries internal BigQuery datasets and will soon expand to call external third-party APIs. You want to enable secure, granular outbound tool authentication without managing custom credential vaults or hardcoding secrets in backend code. What should you do?","opts":[{"id":"A","text":"Attach a service account to the ADK agent runtime for BigQuery access, and store third-party API keys in Secret Manager for backend code to retrieve during tool execution.","correct":false},{"id":"B","text":"Enable Identity-Aware Proxy (IAP) on the Agent Platform host to secure BigQuery access, and configure OAuth 2.0 client IDs to broker outbound tokens for external APIs.","correct":false},{"id":"C","text":"Assign IAM permissions for BigQuery to the agent’s Secure Production Identity Framework for Everyone (SPIFFE)-based agent identity, and store third-party credentials in Agent Identity auth manager to let ADK handle token retrieval and header injection.","correct":true},{"id":"D","text":"Configure Cloud Key Management Service (Cloud KMS) to encrypt third-party API credentials in backend configuration files, and grant the Cloud KMS Decrypter IAM role to the agent’s compute service account.","correct":false}],"answers":["C"]}];
const $=id=>document.getElementById(id),key='agentic-pro-v1';let db;try{db=JSON.parse(localStorage.getItem(key))||{bank:[],wrong:[],session:null}}catch{db={bank:[],wrong:[],session:null}}db.bank=BANK;let s=null;function save(){try{localStorage.setItem(key,JSON.stringify(db))}catch{alert('本機儲存失敗')}}function status(){$('status').textContent='已匯入 '+db.bank.length+' 題；錯題 '+db.wrong.length+' 題';$('resume').disabled=!db.session}status();
$('start').onclick=()=>{let mode=$('mode').value,ids=db.bank.filter(q=>mode!=='wrong'||db.wrong.includes(q.id)).map(q=>q.id);if(!ids.length)return alert('請先匯入題庫或確認有錯題');if($('random').checked)for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}ids=ids.slice(0,Math.max(1,Number($('count').value)||75));s={ids,i:0,mode,answers:{},checked:{},end:Date.now()+Math.max(1,Number($('minutes').value)||120)*60000,done:false};db.session=s;save();render()};
$('resume').onclick=()=>{s=db.session;if(s)s.done?finish():render()};$('clear').onclick=()=>{if(confirm('清除所有本機資料？')){localStorage.removeItem(key);location.reload()}};function qnow(){return db.bank.find(q=>q.id===s.ids[s.i])}function correct(q){return JSON.stringify([...(s.answers[q.id]||[])].sort())===JSON.stringify([...q.answers].sort())}function record(q){if(correct(q))db.wrong=db.wrong.filter(id=>id!==q.id);else if(!db.wrong.includes(q.id))db.wrong.push(q.id)}
function render(){let q=qnow();if(!q)return;$('quiz').hidden=false;$('result').hidden=true;$('meta').textContent=(s.i+1)+' / '+s.ids.length+' · 原題 #'+q.id+' · '+(q.answers.length>1?'複選 '+q.answers.length+' 項':'單選');$('progress').max=s.ids.length;$('progress').value=s.i+1;$('question').textContent=q.text;$('options').replaceChildren();for(const o of q.opts){let l=document.createElement('label'),i=document.createElement('input');i.type=q.answers.length>1?'checkbox':'radio';i.name='answer';i.checked=(s.answers[q.id]||[]).includes(o.id);i.disabled=!!s.checked[q.id];i.onchange=()=>{let a=s.answers[q.id]||[];s.answers[q.id]=i.type==='radio'?[o.id]:i.checked?[...a,o.id]:a.filter(x=>x!==o.id);save()};l.append(i,document.createTextNode(' '+o.id+'. '+o.text));$('options').append(l)}$('feedback').textContent=s.checked[q.id]?(correct(q)?'回答正確':'回答錯誤')+'｜題庫答案：'+q.answers.join(', ')+'（來源答案，未獨立驗證）':'';$('check').hidden=s.mode==='exam';$('check').disabled=!!s.checked[q.id];$('prev').disabled=s.i===0;$('next').disabled=s.i===s.ids.length-1;save();status()}
$('check').onclick=()=>{let q=qnow();if(!(s.answers[q.id]||[]).length)return alert('請選擇答案');s.checked[q.id]=true;record(q);render()};$('prev').onclick=()=>{s.i--;render()};$('next').onclick=()=>{s.i++;render()};$('finish').onclick=()=>{if(confirm('確定交卷？'))finish()};function finish(){s.done=true;let qs=s.ids.map(id=>db.bank.find(q=>q.id===id)).filter(Boolean);qs.forEach(record);save();$('quiz').hidden=true;$('result').hidden=false;$('result').replaceChildren();let h=document.createElement('h2');h.textContent='成績 '+qs.filter(correct).length+' / '+qs.length;$('result').append(h);for(const q of qs){let p=document.createElement('p');p.textContent='#'+q.id+' '+(correct(q)?'正確':'錯誤')+'｜你的答案：'+(s.answers[q.id]||[]).join(', ')+'｜題庫答案：'+q.answers.join(', ');$('result').append(p)}status()}setInterval(()=>{if(s&&!s.done&&s.mode==='exam'){let t=Math.max(0,Math.ceil((s.end-Date.now())/1000));$('meta').textContent=(s.i+1)+' / '+s.ids.length+' · 原題 #'+qnow().id+' · 剩餘 '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(!t)finish()}},1000);
</script></html>
