<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic Pro</title><style>body{font:16px system-ui;background:#edf2f8;color:#18243a;margin:auto;max-width:900px;padding:24px}section{background:white;padding:24px;border-radius:16px;margin:16px 0}button{background:#2459bc;color:white;border:0;padding:12px;border-radius:8px;margin:4px;cursor:pointer}label{display:block;padding:12px;border:1px solid #ccd5e0;border-radius:8px;margin:8px 0;white-space:pre-wrap}h2{white-space:pre-wrap}progress{width:100%}:root{color-scheme:dark}body{background:#09090b;color:#f4f4f5}section{background:#18181b;border:1px solid #303036}button{background:#2563eb}button:disabled{opacity:.4}label{border-color:#3f3f46}label:has(input:checked){background:#172554;border-color:#60a5fa}input,select{background:#27272a;color:#fafafa;border:1px solid #52525b;border-radius:6px;padding:6px}h2{font-size:1.25rem;line-height:1.65}progress{accent-color:#60a5fa}#feedback{color:#93c5fd}</style><h1>Agentic Pro</h1><p>Google Professional Agentic Architect</p><section><p>內建完整題庫 · 直接開始練習</p><p id="status"></p><select id="mode"><option value="practice">一般練習</option><option value="exam">模擬考試</option><option value="wrong">錯題本</option></select><label>題數 <input id="count" type="number" min="1" value="75"></label><label><input id="random" type="checkbox" checked> 隨機出題</label><label>考試分鐘 <input id="minutes" type="number" min="1" value="120"></label><button id="start">開始</button><button id="resume">繼續上次</button><button id="clear">清除資料</button></section><section id="quiz" hidden><p id="meta"></p><progress id="progress"></progress><h2 id="question"></h2><div id="options"></div><p id="feedback"></p><button id="prev">上一題</button><button id="check">確認答案</button><button id="next">下一題</button><button id="finish">交卷</button></section><section id="result" hidden></section><script>
const BANK=[{"id":1,"text":"You are configuring an autonomous support agent using Agent Studio to handle multistep customer inquiries and invoke internal tools and connectors. During interactive testing in the console, the agent demonstrates inconsistent execution trajectories and fails to trigger the right tools. You need to improve the agent’s reliability and accuracy. What should you do first?","opts":[{"id":"A","text":"Enable Agent Search grounding in the Agent Studio tools pane, and lower the model temperature setting in the console configuration panel.","correct":false},{"id":"B","text":"Configure Agent Platform Memory Bank in Agent Runtime to persist multiturn interaction logs, and increase the model’s thinking_level parameter.","correct":false},{"id":"C","text":"Use the side-by-side comparison view in Agent Studio to test alternative foundation models and select a Gemini Pro model variant.","correct":false},{"id":"D","text":"Define imperatively structured system instructions in Agent Studio and add few-shot prompt templates that incorporate step-by-step reasoning examples for tools usage.","correct":true}],"answers":["D"]},{"id":2,"text":"You are designing a conversational agent in Gemini Enterprise to query proprietary internal engineering documentation stored across Cloud Storage and internal enterprise repositories. Your organization’s security governance policy requires that individual users only receive search results from documents they are authorized to access based on their enterprise identity.\n\nYou need to connect this data source to your agent using a managed configuration that automatically enforces these access rules without custom code. What should you do?","opts":[{"id":"A","text":"Store the enterprise documents in Cloud Storage, and configure a RAG Engine serverless pipeline using a basic similarity threshold with IAM condition filters.","correct":false},{"id":"B","text":"Deploy an open-source vector database on Google Kubernetes Engine (GKE), and synchronize document metadata into a separate Firestore database collection.","correct":false},{"id":"C","text":"Index the raw documents into an Agent Retrieval vector index, and configure client-side query filters matching each user’s IAM group membership.","correct":false},{"id":"D","text":"Connect the proprietary data source to an Agent Search enterprise data store with identity-aware access control list (ACL) synchronization enabled.","correct":true}],"answers":["D"]},{"id":3,"text":"You are building a support voice assistant using Customer Experience Agent Studio (CX Agent Studio) for a telecommunications organization. Inbound calls must be dynamically routed based on caller intent. If a caller requests billing details or account changes, PIN/OTP verification is required to establish a secure data-access boundary before any generative resolution steps can be executed. You want to configure the solution with minimal custom code. What should you do?","opts":[{"id":"A","text":"•Build a single generative agent with authentication and troubleshooting components configured as parallel tools.\n•When a customer requests account-sensitive help, execute both tools concurrently to minimize latency, and configure safety filters to redact any diagnostic output if authentication fails.","correct":false},{"id":"B","text":"•Build a sequential cascade of two independent generative agents.\n•Configure the first agent to handle intent classification and the OTP verification, and store state in an external database.\n•Have the second agent poll this database for customer ID and continue the conversation, triggering a custom session initiation protocol (SIP) transfer webhook if needed.","correct":false},{"id":"C","text":"•Build a single generative agent.\n•Use system instructions to classify intent.\n•Use prompt-based guardrails and the model’s memory to enforce authentication before running troubleshooting steps.\n•Execute a custom webhook tool to handle the OTP API call.","correct":false},{"id":"D","text":"•Build a hybrid architecture.\n•Use a generative steering node to classify intent.\n•Route account-sensitive queries to a deterministic flow component for PIN/OTP authentication.\n•Pass the verified customer ID as a session parameter to the runtime.","correct":true}],"answers":["D"]},{"id":4,"text":"You are configuring an agentic workflow in Agent Studio for an enterprise customer analytics platform. The agent was initialized with default system instructions, prompt templates, and a Gemini Flash model family. In staging, you observe that the agent frequently hallucinates when synthesizing data across multiple knowledge documents and produces inconsistent output formats.\n\nYou need to ensure the agent reliably uses verified source context and follows a standardized response format. What should you do first?","opts":[{"id":"A","text":"Update the system instructions to restrict answers strictly to retrieved source data, and reconfigure prompts with chain-of-thought reasoning steps and few-shot input-output examples.","correct":true},{"id":"B","text":"Update the system instructions to reduce the temperature parameter and maximum top-p sampling to zero, and change the model to a Gemini Pro model family.","correct":false},{"id":"C","text":"Update the system instructions with explicit data redaction rules, and configure prompt templates to send all output through a Model Armor filter for schema enforcement.","correct":false},{"id":"D","text":"Update the system instructions to route date parsing requests to a custom Cloud Run OpenAPI extension tool, and reconfigure prompt templates to increase chunk overlap in Agent Search.","correct":false}],"answers":["A"]},{"id":5,"text":"You are designing an automated hotel reservation workflow using Customer Experience Agent Studio (CX Agent Studio). The agent prompts the guest for check-in dates, room tier, and rewards membership status in a dedicated booking page. If a guest selects a luxury suite, the conversation flow should immediately branch to a specialized concierge flow only after the loyalty status parameter is confirmed. You need to configure this routing logic within the visual console without custom webhook middleware. What should you do?","opts":[{"id":"A","text":"Attach a custom JavaScript event handler to the start page to redirect the incoming user session.","correct":false},{"id":"B","text":"Configure a global intent route that overrides active page form parameters during conversation turns.","correct":false},{"id":"C","text":"Configure a conditional transition route on the page that evaluates form parameters before setting the target flow.","correct":true},{"id":"D","text":"Configure a conditional transition route in a session event handler that resets form parameters before setting the target flow.","correct":false}],"answers":["C"]},{"id":6,"text":"You are developing an enterprise customer support agent in Customer Experience Agent Studio (CX Agent Studio). The agent manages an order cancellation workflow that requires verifying customer identity before invoking an external payment refund tool. During testing, when end users provide complex, multi-sentence requests, the agent frequently skips the intermediate identity verification step and calls the refund tool prematurely.\n\nYou need to configure the agent’s behavior to enforce strict, sequential execution of each workflow step. What should you do?","opts":[{"id":"A","text":"Define global instructions in CX Agent Studio’s advanced application settings with broad behavioral constraints to apply to every conversational turn.","correct":false},{"id":"B","text":"Restructure in-console system instructions in CX Agent Studio into XML tags.","correct":true},{"id":"C","text":"Attach a Model Armor security template to the endpoint to sanitize user conversational inputs.","correct":false},{"id":"D","text":"Configure a backward handoff rule on the agent node using a boolean variable check condition to handle transfer errors.","correct":false}],"answers":["B"]},{"id":7,"text":"You are establishing team-wide engineering guidelines in an Antigravity workspace for a cloud-native Go project. You want the agent to automatically enforce a set of enterprise architecture conventions on every interaction, while providing an on-demand database migration workflow that developers can invoke when needed. You need to structure these customizations using native Antigravity configuration files. What should you do?","opts":[{"id":"A","text":"Embed architecture directives and migration workflows inside individual source code comment blocks.","correct":false},{"id":"B","text":"Define migration workflows in GEMINI.md rules, and embed architecture directives in a skill folder.","correct":false},{"id":"C","text":"Configure architecture directives and migration workflows as raw shell scripts inside the skills directory.","correct":false},{"id":"D","text":"Define architecture directives in GEMINI.md rules, and create an on-demand migration workflow in a skill folder.","correct":true}],"answers":["D"]},{"id":8,"text":"You are building a multiagent workflow in Antigravity where a primary coordinator agent delegates code editing and testing tasks to concurrent subagents. During initial execution, subagents edit files in the shared workspace at the same time, causing write conflicts and filling the main chat history with verbose build logs. You want to eliminate file modification conflicts and prevent context rot in the primary coordinator agent. What should you do?","opts":[{"id":"A","text":"Instantiate subagents programmatically with a canary batch cap of three concurrent workers, and store context logs in BigQuery.","correct":false},{"id":"B","text":"Configure subagents to use inherited workspace contexts for code edits, and deploy a PreToolUse hook to upload context logs to a Cloud Storage bucket. Use the stored context for additional prompts.","correct":false},{"id":"C","text":"Configure subagents to use branched workspace isolation for code edits, and offload build execution to isolated worker context sessions.","correct":true},{"id":"D","text":"Define PreToolUse hooks to restrict subagent file write tools, and route build traces to Cloud Logging. Retrieve the stored logs for additional prompts.","correct":false}],"answers":["C"]},{"id":9,"text":"You are establishing an automated unit testing pipeline where Antigravity generates and executes test scripts for third-party Python packages. Your organization’s security requirements state that dynamic test suites generated by the LLM must never access local host credentials, private developer files, or unapproved internal network services. You need to configure a secure execution runtime for the coding agent. What should you do?","opts":[{"id":"A","text":"Configure a .antigravityrules markdown file in the repository instructing the agent to never generate code that reads host files or connects to external domains.","correct":false},{"id":"B","text":"Assign a Google Cloud service account with restricted, least-privilege IAM roles to the pipeline execution host.","correct":false},{"id":"C","text":"Execute agent-generated test scripts inside isolated, containerized execution sandboxes.","correct":true},{"id":"D","text":"Configure a VPC Service Controls perimeter around the pipeline’s execution subnet.","correct":false}],"answers":["C"]},{"id":10,"text":"You are implementing a custom skill in the Antigravity CLI to automate service deployments. When executing tasks in Agent Mode, the CLI fails to detect the skill and bypasses user confirmation before running deployment commands. You want to enable effective skill discovery globally while ensuring that human approvals are required for high-risk actions. What should you do?","opts":[{"id":"A","text":"Verify that a SKILL.md file containing valid YAML metadata is present in the ~/.gemini/antigravity-cli/skills/ directory, and execute the Agents CLI without auto-approval flags.","correct":true},{"id":"B","text":"Upload the deployment script to Cloud Deploy as an agent extension, and run the agents-cli setup command with the -- force flag.","correct":false},{"id":"C","text":"Verify that a SKILL.md file containing valid YAML metadata is present in the .agents/skills directory, and execute the Agents CLI without auto-approval flags.","correct":false},{"id":"D","text":"Register the skill as an MCP server inside the .agents/skills/ directory for each deployment, and launch the Agents CLI using the -y flag.","correct":false}],"answers":["A"]},{"id":11,"text":"Your organization maintains an internal service registry that lists the endpoints exposed by various teams across the organization. Endpoints are added and removed throughout the day. Your team uses Antigravity to write client code against the endpoints. You discover that the agent is generating code referencing stale, decommissioned endpoints. You need Antigravity to dynamically verify active endpoints from the registry in real time while generating code. What should you do?","opts":[{"id":"A","text":"Create an MCP server, and connect Antigravity to the registry using the MCP.\n\t\t\t\t\t\t Most Voted","correct":true},{"id":"B","text":"Define a custom Antigravity subagent whose role is endpoint lookup.","correct":false},{"id":"C","text":"Add the endpoint list to an Antigravity workspace rule.","correct":false},{"id":"D","text":"Add an Antigravity PostToolUse hook that checks generated calls against the registry.","correct":false}],"answers":["A"]},{"id":12,"text":"Your team uses Antigravity coding agent for both app development and infrastructure as code (IaC) provisioning. Your organization maintains an extensive internal infrastructure style guide that the agent currently includes in the persistent workspace configuration, causing context window congestion and degrading reasoning performance during noninfrastructure coding tasks. You need to configure the agent to automatically load and follow the style guide only when infrastructure tasks are initiated. What should you do?","opts":[{"id":"A","text":"Create a custom skill with the style guide containing a SKILL.md file that defines activation criteria in its frontmatter.","correct":true},{"id":"B","text":"Add the style guide to the global system instructions within the Antigravity agent settings.","correct":false},{"id":"C","text":"Add the style guide as a documentation resource by deploying an MCP server for the agent.","correct":false},{"id":"D","text":"Add the style guide to a .gemini/rules file in the root of the project workspace.","correct":false}],"answers":["A"]},{"id":13,"text":"You are configuring custom coding agents using Antigravity for an enterprise engineering team. You discover that the agent frequently attempts to execute unauthorized terminal commands despite instructions in the project’s markdown context files specifying command boundaries. You need to enforce strict, deterministic guardrails that validate shell command arguments prior to tool execution. What should you do?","opts":[{"id":"A","text":"Define a specialized Antigravity subagent in the .agents/subagents/ directory configured with a review prompt to evaluate and approve terminal commands prior to delegating execution.","correct":false},{"id":"B","text":"Configure an Antigravity PreToolUse hook in a .agents/hooks.json file to run a script that sends the command string to a remote LLM API for a semantic safety review.","correct":false},{"id":"C","text":"Update the Antigravity workspace rule activation mode to ‘Always On’ in the .agents/rules/ directory to ensure system instructions for command boundary checking are prepended to every conversation turn.","correct":false},{"id":"D","text":"Configure an Antigravity PreToolUse hook in a .agents/hooks.json file to run a validation script to inspect command line flags from stdin.","correct":true}],"answers":["D"]},{"id":14,"text":"You are customizing enterprise coding workflows by augmenting Antigravity CLI with Agents CLI. Your team needs to package reusable agent capabilities and safety guardrails across developer workspaces while executing automated verifications before cloud deployment. You also need to maintain consistent governance and agent behavior across all local workspaces. What should you do?","opts":[{"id":"A","text":"Transform system instructions into workspace context files, and use the agents-cli run command to validate behaviors before attaching them to Agent Gateway.","correct":false},{"id":"B","text":"Define persona subagents into workspace configuration files, and use the agents-cli deploy command to validate behaviors before publishing them to Agent Registry.","correct":false},{"id":"C","text":"Convert the agent capabilities into shareable Agent Skills, and use the agents-cli eval command to validate behaviors before publishing them to Agent Registry.","correct":true},{"id":"D","text":"Deploy guardrails as server-side workspace hooks, and use the agents-cli scaffold command to validate behaviors before storing them in Model Armor.","correct":false}],"answers":["C"]},{"id":15,"text":"You are configuring Claude Code on Google Cloud to help developers refactor microservices. You created a custom tool service using an MCP server that runs locally through standard input/output (stdio). You need to configure Claude Code so the coding agent automatically discovers and executes the tools exposed by the MCP server during interactive sessions. What should you do?","opts":[{"id":"A","text":"Export the tool function signatures as a JSON-encoded string in the CLAUDE_CODE_TOOLS environment variable before launching the CLI.","correct":false},{"id":"B","text":"Define the custom tool definitions in a SKILLS.md file in the project’s root directory.","correct":false},{"id":"C","text":"Add the MCP server command field with executable code and arguments under the mcpServers object in the .claude.json file.","correct":true},{"id":"D","text":"Register the MCP server to Agent Registry using Claude Code console.","correct":false}],"answers":["C"]},{"id":16,"text":"You are using CodeMender on Gemini Enterprise Agent Platform to remediate a critical SQL injection vulnerability in an enterprise Python web app. You need the coding agent to generate a production-ready patch that resolves the underlying vulnerability while keeping the existing app functionality intact. What should you do?","opts":[{"id":"A","text":"Configure CodeMender’s patch generator to execute dynamic database schema migrations to sanitize incoming string inputs before query execution.","correct":false},{"id":"B","text":"Generate a patch using CodeMender’s automated remediation workflow, and use its built-in LLM-as-a-judge framework to validate program equivalence against the generated code diff.","correct":true},{"id":"C","text":"Grant CodeMender’s execution identity the roles/iam.securityUser IAM role to run commands.","correct":false},{"id":"D","text":"Instruct CodeMender to wrap dynamic SQL queries in try-except error handling blocks and retry failed queries using the default fallback parameters.","correct":false}],"answers":["B"]},{"id":17,"text":"Your organization requires a scanner that looks for secrets and API keys to run before Antigravity writes to any file in a repository. You added an Antigravity workspace rule that instructs the agent to run the scanner first. However, you discover some commits where the scanner did not run. You need to ensure that the scanner runs before every file write, regardless of what the agent judges as relevant. What should you do?","opts":[{"id":"A","text":"Change the Antigravity rule’s activation mode to ‘Always On’.","correct":false},{"id":"B","text":"Configure an Antigravity PreToolUse hook in a hooks.json file that runs the scanner.","correct":true},{"id":"C","text":"Create an Antigravity subagent that runs the scanner before file writes.","correct":false},{"id":"D","text":"Create an Antigravity skill to run the scanner.","correct":false}],"answers":["B"]},{"id":18,"text":"You are designing a multiagent workflow using Agent Development Kit (ADK) on Agent Runtime that includes an orchestrator agent and an interactive claim adjuster agent. The claim adjuster agent is currently implemented as an agent-as-a-tool but is treating turns as isolated requests, loses conversation history, and cannot hand control back to the orchestrator agent.\n\nYou need to rearchitect this coordination pattern so the claim adjuster maintains stateful multiturn history, accesses shared context, and supports fluid, bidirectional handoffs. What should you do?","opts":[{"id":"A","text":"Enable use_shared_memory=True in the tool parameter schema to force the tool container to inherit the orchestrator agent’s active session history.","correct":false},{"id":"B","text":"Rearchitect the claim adjuster agent as a stateful subagent within a hierarchical multiagent graph workflow, enabling shared session state and model-driven delegation for context preservation and bidirectional handoffs.","correct":true},{"id":"C","text":"Configure the agent-as-a-tool execution policy with an asynchronous polling webhook that continuously queries the Agent Registry for updated stateful session context logs.","correct":false},{"id":"D","text":"Deploy the claim adjuster agent as a stateful Agent Runtime instance, and configure Agent Identity auth manager to pass session state tokens in the HTTP payload body.","correct":false}],"answers":["B"]},{"id":19,"text":"You are troubleshooting a hierarchical multiagent architecture built with Agent Development Kit (ADK), where a primary orchestrator delegates complex search tasks to specialized subagents. The execution traces show that subagents are appending their full tool execution histories into the orchestrator’s context window across multiturn exchanges, causing rapid context window bloat, agent drift, and severe tool invocation latency. You need to isolate subagent execution history and prevent context pollution in the orchestrator. What should you do?","opts":[{"id":"A","text":"Deploy subagents inside a sequential pipeline, and enable summarization compaction on the orchestrator’s Cloud Storage log bucket in Agent Designer.","correct":false},{"id":"B","text":"Wrap subagents using agent tool encapsulation, configure the subagent LLM settings to exclude previous conversation contents, and persist subagent findings to the session state.","correct":true},{"id":"C","text":"Configure a Pub/Sub topic to decouple subagent events from the orchestrator, and configure the orchestrator agent in Agent Runtime to prevent transferring control back to a parent agent.","correct":false},{"id":"D","text":"Increase the maximum iterations limit on the orchestrator’s looping agent definition, and configure Cloud Trace sampling to automatically drop duplicate tool payload traces.","correct":false}],"answers":["B"]},{"id":20,"text":"You are building an automated medical research assistant agent in Gemini Enterprise to analyze rare disease patient records. Ingestion includes high-resolution radiology scans and unstructured handwritten clinical notes saved in Cloud Storage. The agent needs to correlate fine visual tissue abnormalities in the radiology scans with contextual annotations in physician notes.\n\nYou need to configure the data ingestion and modeling pipeline to maximize diagnostic correlation without losing spatial or visual details. What should you do?","opts":[{"id":"A","text":"Send the raw Cloud Storage scan and note URIs to the native multimodal Gemini model using full-resolution file references.","correct":true},{"id":"B","text":"Process the notes using an external optical character recognition (OCR) service, and downsample radiology scans to low-resolution JPEG images.","correct":false},{"id":"C","text":"Extract image feature embeddings using a separate vision-only classification model, and store them in Vector Search along with plain text notes.","correct":false},{"id":"D","text":"Convert the radiology scans into text-based pixel matrix arrays, convert the notes to text, and append both into standard text prompt templates.","correct":false}],"answers":["A"]},{"id":21,"text":"You are building a custom retail assistant agent using Agent Development Kit (ADK). The agent checks real-time stock levels by querying a proprietary internal inventory database. You have written a secure Python function that executes this query. You need to integrate this function so the underlying Gemini model can autonomously decide when to invoke the function and automatically format the required parameters based on user input. What should you do?","opts":[{"id":"A","text":"Inject the raw Python function code into the agent’s system prompt, and instruct the LLM to output a native Python eval() command containing the necessary variables.","correct":false},{"id":"B","text":"Deploy the Python function as a Cloud Run service, and configure an ADK preprocessing script to intercept the user’s prompt using regex keyword matching to trigger the service.","correct":false},{"id":"C","text":"Upload the Python script to Agent Registry, and configure the ADK agent’s orchestrator to perform a semantic vector search against the registry to execute the code dynamically.","correct":false},{"id":"D","text":"Wrap the Python function using an ADK function tool, explicitly define the input parameters using type hints, provide a detailed docstring explaining the tool’s purpose, and supply the tool to the agent during initialization.","correct":true}],"answers":["D"]},{"id":22,"text":"You are building an autonomous financial research agent using Agent Development Kit (ADK). The agent has access to a registry of more than 50 distinct financial analysis tools. When you bind all 50 tools to the agent simultaneously, the system prompt consumes too many tokens, leading to high latency, increased costs, and frequent LLM hallucinations where the agent selects the wrong tool schema. You need to optimize the agent’s tool-calling accuracy and reduce token consumption while ensuring all 50 tools remain available for the workflow. What should you do? (Choose two.)","opts":[{"id":"A","text":"Increase the model’s temperature parameter to allow the agent to find the correct tool schema from memory.","correct":false},{"id":"B","text":"Implement an ADK semantic tool retriever to query a vector index and only fetch the top-K most relevant tools based on the user’s current prompt.","correct":true},{"id":"C","text":"Combine a subset of all 50 tools into a single ADK ToolChain object to compress the tool schemas into a single system prompt description.","correct":false},{"id":"D","text":"Configure an ADK asynchronous execution hook to run tools in parallel and return only the valid data payloads to the agent.","correct":false},{"id":"E","text":"Dynamically bind only a retrieved subset of tools to the agent’s execution context before initiating the reasoning loop.","correct":true}],"answers":["B","E"]},{"id":23,"text":"You are designing an agentic workflow in Gemini Enterprise for a media organization. The agent will enable natural language search across thousands of hours of archived video training content. End users must be able to search the video library using text queries and receive precise video segment matches. Your solution must process video files stored in Cloud Storage, map visual content and user text queries into a shared vector space, and perform real-time similarity retrieval at scale. What should you do? (Choose two.)","opts":[{"id":"A","text":"Store video files with embeddings in BigQuery, create a vector index, and execute pattern matching queries against the index.","correct":false},{"id":"B","text":"Convert video files into Base64-encoded strings, and store them in the vector store. Send query requests to the Gemini API.","correct":false},{"id":"C","text":"Index the generated embedding vectors in Vector Search to perform approximate nearest neighbor (ANN) retrieval for user query embeddings.","correct":true},{"id":"D","text":"Use the Text embeddings API with the text-embedding-005 model to generate vectors from Cloud Storage video object path strings and file names.","correct":false},{"id":"E","text":"Generate vector representations for video segments using the Multimodal embeddings API in Agent Platform.","correct":true}],"answers":["C","E"]},{"id":24,"text":"You are developing a customer support agent in Gemini Enterprise that analyzes incoming customer incident reports. These reports contain recorded audio calls in MP3 and WAV format and long video-screen captures that are up to 45 minutes long. When making a call to the Gemini API with raw Base64 payload, the request fails due to a 413 error: size too large. You need to enable the agent workflow to process, analyze, and summarize these large audio and video files natively using Gemini models without hitting payload restrictions or needing preconversion steps. What should you do?","opts":[{"id":"A","text":"Store compressed video and audio files in a Cloud SQL database, and configure a Gemini Enterprise database connector to stream binary objects.","correct":false},{"id":"B","text":"Upload the audio and video files to a Cloud Storage bucket, and pass the Cloud Storage URIs in the request content to the Gemini API.","correct":true},{"id":"C","text":"Convert audio files into 16-bit PCM WAV chunks, and embed them using the text-embeddings API.","correct":false},{"id":"D","text":"Transcode audio and video files into Base64 chunk strings, and send them sequentially through Pub/Sub messages to the Gemini API endpoint.","correct":false}],"answers":["B"]},{"id":25,"text":"You are developing a custom financial analysis agent in Python using Agent Development Kit (ADK). The agent calls an exchange rate function when users request cross-border portfolio valuations, but during multi-turn interactions, the model frequently passes invalid currency codes or fails to trigger the function. You need to ensure the agent reliably invokes the function with valid parameter types. What should you do?","opts":[{"id":"A","text":"Implement a custom retry-loop wrapper around the tool execution call to catch malformed parameter exceptions and automatically reprompt the model.","correct":false},{"id":"B","text":"Define tool parameter schemas as unformatted string lists inside the agent system instructions.","correct":false},{"id":"C","text":"Apply a Pydantic @validate_call decorator parameter to the Python function to raise a runtime ValidationError result if an unapproved parameter value is passed to the function.","correct":false},{"id":"D","text":"Define explicit Python type annotations and detailed parameter docstrings in the tool function signature.","correct":true}],"answers":["D"]},{"id":26,"text":"You are lead architect at an organization where multiple engineering teams are building conversational agents. Teams frequently need their agents to query operational telemetry in BigQuery and inspect Cloud Logging logs. Currently, teams duplicate effort by writing custom API wrapper scripts and individual credential management logic for every agent tool.\n\nYou need to establish an enterprise-wide tool integration architecture that provides ready-to-use cloud capability connectors and a shared governance directory for team capabilities without writing bespoke wrapper code. What should you do?","opts":[{"id":"A","text":"Deploy serverless Cloud Run functions for each cloud service API, and configure direct HTTP webhooks inside each agent prompt.","correct":false},{"id":"B","text":"Configure Dialogflow conversational fulfillment webhooks to route all agent capability requests through a central proxy service.","correct":false},{"id":"C","text":"Connect the agents to Google Cloud MCP servers, and register shared tools in Agent Registry.","correct":true},{"id":"D","text":"Configure Agent Platform Feature Store to store key-value client profile attributes, and execute a custom feature retrieval API call during agent prompt construction to inject historical facts.","correct":false}],"answers":["C"]},{"id":27,"text":"You developed a document processing pipeline in which an extraction agent and a scoring agent exchange records using the Agent2Agent (A2A) protocol. The agents were written using Agent Development Kit (ADK) and are deployed as two separate Agent Runtime agents, and neither agent is called from outside the pipeline.\n\nYou discover that each record takes 400 milliseconds longer than expected to process. Your profiling tool attributes the added time to serialization and network calls between the two agents. You want to minimize processing time and ensure that each agent keeps its current logic and continues to handle one record per invocation. What should you do?","opts":[{"id":"A","text":"Replace A2A with an MCP server between the two Agent Runtime agents.","correct":false},{"id":"B","text":"Deploy both agents in the same Agent Runtime, and configure the scoring agent as a local subagent of the extraction agent.","correct":true},{"id":"C","text":"Deploy both Agent Runtime agents in the same region and use private networking.","correct":false},{"id":"D","text":"Use the gRPC binding for the A2A transport between the two Agent Runtime agents.","correct":false}],"answers":["B"]},{"id":28,"text":"You are designing an automated code-refactoring assistant using the open-source Agent Development Kit (ADK) library. The solution requires a multistep process where a generator agent drafts modernized code, a critic agent evaluates the draft against strict security rules, and a refiner agent modifies the code until the critic agent approves the output or an exit condition is met. You need to select an agentic workflow architecture that natively supports this continuous generation, evaluation, and revision cycle. What should you do?","opts":[{"id":"A","text":"Implement an ADK LoopAgent that contains the critic and refiner subagents using AgentTool. Configure a retry_options parameter on the Gemini model configuration object to limit repeated reasoning attempts.","correct":false},{"id":"B","text":"Configure an ADK SequentialAgent that chains the critic and refiner subagents. Implement an Agent Runtime event callback to retrigger the workflow when security checks fail.","correct":false},{"id":"C","text":"Implement an ADK LoopAgent that contains the critic and refiner subagents. Set max_iterations to bound loop execution, and provide the critic agent with a tool to exit the loop upon approval.","correct":true},{"id":"D","text":"Construct an ADK ParallelAgent that runs the critic and refiner subagents concurrently. Deploy the app to Cloud Run with a request timeout threshold to cap total execution time.","correct":false}],"answers":["C"]},{"id":29,"text":"You are building a custom coding assistant agent using Agent Development Kit (ADK). The agent must recall user preferences, past architectural decisions, and previous debugging steps across completely independent interactive sessions over multiple weeks. You need to complete these tasks without endlessly growing the LLM context window and inflating inference costs, and you want to implement the simplest solution. How should you build the agent?","opts":[{"id":"A","text":"Build a custom retrieval pipeline, embed each session’s conversation turns into Vector Search, and manually query the top-k relevant chunks.","correct":false},{"id":"B","text":"Serialize the conversation history to a Cloud SQL database at the end of each session, and use custom ADK logic to prepend the entire history to the system prompt of the next session.","correct":false},{"id":"C","text":"Enable the managed sessions feature in Agent Runtime, and configure a 30-day session_ttl parameter.","correct":false},{"id":"D","text":"Configure the agent to use Agent Platform Memory Bank to manage and retrieve long-term conversational state.","correct":true}],"answers":["D"]},{"id":30,"text":"You are configuring Agent Platform Memory Bank for a wealth management advisor agent deployed on Gemini Enterprise Agent Platform.\n\nDuring initial evaluation, you notice that Memory Bank creates duplicate and conflicting memory entries when users update their investment risk tolerance. You need to configure the Memory Bank to properly consolidate updated user preferences over time, resolve conflicting information, and restrict memory extraction strictly to relevant personal information and user preferences. What should you do? (Choose two.)","opts":[{"id":"A","text":"Add user risk tolerance values into the system instruction prompt as immutable string constants during session creation.","correct":false},{"id":"B","text":"Disable identity scoping on the Memory Bank instance to do a similarity search for user information during memory consolidation.","correct":false},{"id":"C","text":"Configure memory topic customization in Memory Bank to enable the USER_PERSONAL_INFO and USER-PREFERENCES managed topics.","correct":true},{"id":"D","text":"Set an in-memory FIFO eviction policy on the managed session service to automatically purge older session event logs when user profile updates occur.","correct":false},{"id":"E","text":"Specify a consistent user identity scope during memory generation and retrieval.","correct":true}],"answers":["C","E"]},{"id":31,"text":"You are designing an enterprise multiagent system where a primary supervisor agent delegates high-level autonomous subtasks to specialized agents owned by separate organizations. Each specialized agent requires standardized access to local databases and custom internal tool execution functions. You need to maximize system interoperability and architectural modularity by implementing the correct protocol abstraction for tool integration versus interagent delegation across organizational boundaries. What should you do?","opts":[{"id":"A","text":"Use MCP servers to expose local databases and tool functions to the specialized agents, and publish Agent2Agent (A2A) protocol Agent Cards to handle supervisor-to-agent task delegation.","correct":true},{"id":"B","text":"Deploy specialized agents to Agent Runtime as MCP servers for supervisor-to-agent task delegation, and wrap local databases as OpenAPI extension tools.","correct":false},{"id":"C","text":"Configure Agent Development Kit (ADK) OpenAPI schemas for supervisor-to-agent task delegation, and expose local databases to specialized agents by using Agent2Agent (A2A) protocol endpoints.","correct":false},{"id":"D","text":"Use Agent2Agent (A2A) protocol endpoints to expose local databases and tool functions to specialized agents, and configure MCP servers to handle supervisor-to-agent task delegation.","correct":false}],"answers":["A"]},{"id":32,"text":"You are developing a technical support agent using Gemini Enterprise Agent Platform to assist internal field engineers. You need to ground the agent’s responses strictly in internal proprietary equipment manuals. You want to minimize hallucinations and maximize response accuracy. What should you do?","opts":[{"id":"A","text":"Convert the proprietary manuals into structured JSON arrays, and inject them as system_instructions.","correct":false},{"id":"B","text":"Export the proprietary manuals to a relational database, and define a custom Python FunctionTool to fetch document snippets.","correct":false},{"id":"C","text":"Enable the googleSearch tool in the agent’s runtime setup.","correct":false},{"id":"D","text":"Implement a retrieval tool in the agent’s configuration, and point the vertex_ai_search parameter to the resource path of your Agent Search data store.","correct":true}],"answers":["D"]},{"id":33,"text":"You are orchestrating a distributed multiagent system on Google Cloud where a primary supervisor agent, built using Agent Development Kit (ADK), must coordinate with multiple specialized subagents developed by different teams across the organization. You need to ensure language-agnostic interoperability and seamless, secure collaboration between these diverse agents without exposing internal context databases. What should you do?","opts":[{"id":"A","text":"Implement the MCP using McpToolset on the supervisor agent to parse and execute internal JSON-RPC calls to the subagents.","correct":false},{"id":"B","text":"Have all agents bypass the application layer and interact with a shared, centralized TaskStore Spanner database to maintain state.","correct":false},{"id":"C","text":"Deploy the subagents in a single monolithic container, and use standard function calls.","correct":false},{"id":"D","text":"Expose the subagents over HTTPS using the Agent2Agent (A2A) protocol, and have the supervisor agent interact with the subagents using A2A.","correct":true}],"answers":["D"]},{"id":34,"text":"You are designing a multiagent enterprise architecture on Google Cloud using the Agent2Agent (A2A) protocol. A central supervisor agent delegates complex subtasks to independently deployed, specialized subagent microservices hosted in separate projects. During high-volume batch runs, long-running subagent tasks fail due to connection timeouts caused by the supervisor agent blocking synchronous HTTP polling. You need to rearchitect the interagent communication layer. What should you do?","opts":[{"id":"A","text":"Configure a Pub/Sub topic between projects and instruct the supervisor to issue system-level SIGCONT process signals to remote subagent container runtimes upon task completion.","correct":false},{"id":"B","text":"Wrap the subagent microservices in an MCP HTTP transport layer using Cloud Run container instances.","correct":false},{"id":"C","text":"Configure the subagents to expose A2A-compliant server-sent event (SSE) streaming endpoints and event webhooks.","correct":true},{"id":"D","text":"Increase the supervisor agent’s HTTP client connection timeout to 3,600 seconds, and set a stream=True parameter in the request payload body.","correct":false}],"answers":["C"]},{"id":35,"text":"You maintain an inventory management agent that uses multiple APIs as tools. You need to automatically verify that the agent selects the correct tool and formulates the correct API arguments when a new agent configuration is pushed to the code repository. The evaluation must run programmatically and determine the pass/fail status using semantic match criteria rather than exact string matching. What should you do?","opts":[{"id":"A","text":"Integrate the gen AI evaluation service into your CI/CD pipeline to automatically execute a golden dataset of queries against the agent, and use autorater metrics for tool selection accuracy and parameter validity.","correct":true},{"id":"B","text":"Enable Model Monitoring on the deployed agent to continuously track prediction drift and alert the pipeline if the frequency of specific tool invocations deviates from the baseline distribution.","correct":false},{"id":"C","text":"Configure a Cloud Scheduler job that invokes the agent during the pipeline build with a set of test prompts, and write a custom script to verify if the agent’s final text response matches a hardcoded string.","correct":false},{"id":"D","text":"Configure a Cloud Monitoring alerting policy on the Agent Runtime metrics to automatically halt the CI/CD deployment if the rate of HTTP 5xx errors from tool invocations exceeds your established threshold.","correct":false}],"answers":["A"]},{"id":36,"text":"You are building a social media monitoring agent pipeline in Google Cloud that analyzes five million incoming customer feedback posts per day. The pipeline must classify each post into one of three sentiment categories: positive, negative, or neutral. The pipeline must also generate a one-sentence summary for each post. You need to configure the language model to minimize inference cost and latency while maintaining high classification accuracy. What should you do?","opts":[{"id":"A","text":"Route incoming posts in real time to an LLM using a provisioned throughput endpoint.","correct":false},{"id":"B","text":"Route the classification task to a high-capacity reasoning LLM, and offload the summarization task to a local regex pipeline.","correct":false},{"id":"C","text":"Deploy a generalized pre-trained small language model (SLM) on an autoscaling online prediction endpoint with GPU acceleration.","correct":false},{"id":"D","text":"Deploy a fine-tuned small language model (SLM) on Gemini Enterprise optimized for high-throughput batch classification.","correct":true}],"answers":["D"]},{"id":37,"text":"You are troubleshooting a production customer device support agent built using Customer Experience Agent Studio (CX Agent Studio). Users report that the agent occasionally returns inaccurate warranty extension terms and device repair procedures that do not exist in the connected enterprise Knowledge Base datastore or tool outputs. You inspected the affected sessions and raw JSON responses, and verified system instructions, variable states, and tool outputs.\n\nYou need to identify the root cause of the hallucination errors and enforce strict grounding while minimizing conversational latency. What should you do?","opts":[{"id":"A","text":"Refine the system instructions using XML tags to explicitly prohibit the agent from answering using its own internal parametric memory, and run evaluation test cases with the “Find issues with AI” option enabled to generate a loss_report.","correct":true},{"id":"B","text":"Configure Cloud Monitoring log-based metrics and alerting policies to track HTTP 500 status code errors across downstream Knowledge Base endpoints, and increase the API execution timeout threshold within the CX Agent Studio global connector settings.","correct":false},{"id":"C","text":"Implement a custom before_model_callback Python function to intercept the conversation call, programmatically analyze the current agent behavior and conversational state to test for missing logic pieces, and dynamically inject hardcoded corrective instructions into the session variables before each model turn.","correct":false},{"id":"D","text":"Export the conversation logs to BigQuery, run SQL queries to calculate overall session latency and token consumption, and decrease the Gemini model’s temperature setting in CX Agent Studio to 0.0.","correct":false}],"answers":["A"]},{"id":38,"text":"You are evaluating a multitool customer support agent built using Agent Development Kit (ADK) against a curated golden dataset of complex, multiturn user queries. During initial testing, the agent frequently returns plausible final answers but skips intermediate knowledge retrieval steps or generates responses unsupported by retrieved context, leading to ungrounded claims in production. You need to systematically isolate retrieval quality failures from response generation errors while preventing regressions in tool sequence trajectory accuracy. What should you do?","opts":[{"id":"A","text":"Configure supervised fine-tuning using the golden dataset as training pairs to enforce deterministic tool call parameters and eliminate ungrounded response generation. Execute a gen AI evaluation service EvalTask.","correct":false},{"id":"B","text":"Deploy a Cloud Monitoring dashboard linked to Cloud Logging telemetry to alert on low vector similarity scores from Agent Search retrieval calls. Execute a gen AI evaluation service EvalTask.","correct":false},{"id":"C","text":"Execute a gen AI evaluation service EvalTask using the golden dataset, and specify Groundedness metrics alongside trajectory sequence match metrics to separately evaluate retrieval context fidelity and tool call execution.","correct":true},{"id":"D","text":"Implement Agent Designer guardrails with mandatory retrieval filters to automatically drop agent responses that do not achieve high lexical similarity to reference documents. Add a human-in-the-loop approval workflow.","correct":false}],"answers":["C"]},{"id":39,"text":"You are preparing to deploy an enterprise technical troubleshooting agent built using Agent Development Kit (ADK). Your company’s QA team has compiled 500 representative customer support test cases paired with authoritative reference documents and expected answer trajectories. You need to establish a continuous integration testing process to measure document retrieval precision and answer faithfulness before releasing software updates. How should you configure the evaluation pipelines in ADK using the agents-cli eval run command?","opts":[{"id":"A","text":"Implement a scoring script that computes raw cosine similarity between embedding vectors of agent responses and reference answers.","correct":false},{"id":"B","text":"Measure task trajectory completion rates and exact-match tool call argument accuracy against baseline test logs.","correct":false},{"id":"C","text":"Measure context precision and recall for documents against the ground truth.","correct":true},{"id":"D","text":"Assess model response trajectories using semantic BLEU and ROUGE n-gram overlap scoring against reference answers.","correct":false}],"answers":["C"]},{"id":40,"text":"You are implementing a continuous evaluation pipeline for an agent built using Agent Development Kit (ADK) that invokes multiple external API tools. During evaluation runs, the agent frequently selects the wrong tools or executes them in an incorrect order, resulting in errors during multistep workflows. You need to establish automated evaluation gates in your CI/CD pipeline to improve execution reliability before model or prompt changes are promoted to production. What should you do?","opts":[{"id":"A","text":"Configure Agent Gateway policies with Model Armor templates to inspect function-calling payloads at runtime trajectories and automatically trigger fallback routes when unexpected tool call arguments are detected.","correct":false},{"id":"B","text":"Configure continuous evaluation runs in the CI/CD pipeline using the gen AI evaluation service configured with trajectory metrics to evaluate the agent’s tool call sequence against golden datasets.","correct":true},{"id":"C","text":"Configure Agent Platform Memory Bank session persistence and Agent Registry governance rules to replay historical user session trajectory and automatically downgrade agent revisions when tool call errors occur.","correct":false},{"id":"D","text":"Configure automated presubmit tests in Cloud Build using the gen AI evaluation service configured with response-level metrics to score the final text generated by the agent.","correct":false}],"answers":["B"]},{"id":41,"text":"You are developing an autonomous agent flow deployed on Gemini Enterprise Agent Platform that executes function calling tools against backend cloud APIs. Updates to the API schemas have caused intermittent tool execution failures, causing the agent to generate invalid parameter payloads. You need to enhance your diagnostics, identify regressions, and establish quality metrics to benchmark full user interactions. What should you do?","opts":[{"id":"A","text":"Configure a continuous evaluation pipeline using the gen AI evaluation service to compare tool call histories against reference trajectories using trajectory metrics, and log the results in Experiments on Agent Platform.","correct":true},{"id":"B","text":"Create custom Cloud Logging log metrics to extract function calling HTTP 400 error codes from production agent trace logs, route the metrics to BigQuery, and trigger Cloud Monitoring alert policies when tool execution failure rates cross established thresholds.","correct":false},{"id":"C","text":"Build an automated evaluation workflow using the gen AI evaluation service to evaluate the agent’s final text responses using pointwise LLM-as-a-judge and ROUGE-L similarity metrics against ground-truth response datasets.","correct":false},{"id":"D","text":"Deploy a Model Armor security template on the agent runtime to validate tool schema compliance, inspect request payloads for malformed JSON parameters, and sanitize invalid function arguments before API invocation.","correct":false}],"answers":["A"]},{"id":42,"text":"You are deploying a custom AI assistant written in Python using Agent Development Kit (ADK). You want to maximize developer velocity by deploying the agent code with minimal infrastructure plumbing, while ensuring the agent has built-in, out-of-the-box access to manage conversational session history and memory persistence. How should you deploy this agent?","opts":[{"id":"A","text":"Deploy the agent to Agent Runtime with Agent Platform Sessions and Agent Platform Memory Bank.","correct":true},{"id":"B","text":"Deploy the agent as a containerized workload on Cloud Run. Configure an external BigQuery table to log and retrieve session messages.","correct":false},{"id":"C","text":"Package the agent logic into a standard container. Deploy the container to Google Kubernetes Engine (GKE) with Agent Platform Sessions and Agent Platform Memory Bank.","correct":false},{"id":"D","text":"Deploy the agent on Cloud Run. Attach a Bigtable instance to manage conversational state and session history.","correct":false}],"answers":["A"]},{"id":43,"text":"You are architecting an enterprise agentic system in Google Cloud. The workload includes two distinct microservices: a stateful orchestrator that manages multistep reasoning workflows with asynchronous tool execution loops and agent-level security boundaries and a stateless transformation service that handles unpredictable bursty data processing workloads. You need to deploy these services using managed Google Cloud runtimes, and minimize operational management overhead and infrastructure cost. What should you do?","opts":[{"id":"A","text":"Deploy the orchestrator service on Agent Runtime, and host the transformation service in a Code Execution sandbox.","correct":false},{"id":"B","text":"Deploy the orchestrator and the transformation service on Agent Runtime as unified agent capability endpoints.","correct":false},{"id":"C","text":"Deploy the orchestrator on Agent Runtime for managed workflow lifecycles, and deploy the transformation service on Cloud Run.","correct":true},{"id":"D","text":"Deploy the transformation service on Agent Runtime, and host the orchestrator on Google Kubernetes Engine (GKE) Autopilot clusters.","correct":false}],"answers":["C"]},{"id":44,"text":"You are architecting an enterprise agent system that will process sensitive financial records. The traffic consists of high-volume, high-token classification tasks. You need to design the system to minimize operational costs and limit the number of requests sent outside the bank network. What should you do?","opts":[{"id":"A","text":"Deploy an open-weight small language model (SLM) on Cloud Run functions with public HTTPS endpoints. Forward unparsed financial payloads to Gemini using LLM Gateway.","correct":false},{"id":"B","text":"Provision dedicated Google Kubernetes Engine (GKE) GPU nodes to host an open-source LLM that processes all agent subtasks within the VPC.","correct":false},{"id":"C","text":"Configure Agent Platform Provisioned Throughput on a managed Gemini model to handle both routine high-volume subtasks and complex agent reasoning under a fixed monthly quota.","correct":false},{"id":"D","text":"Deploy an open-weight small language model (SLM) on Google Kubernetes Engine (GKE) in a private Google Cloud perimeter for routine subtasks. Dynamically route complex reasoning steps to a managed enterprise LLM API.","correct":true}],"answers":["D"]},{"id":45,"text":"You are architecting a research AI infrastructure for a university computing facility that supports two distinct academic workloads:\n\n•A high-volume, 24/7 data extraction pipeline handling sensitive student records subject to strict data residency rules.\n\n•An intermittent, complex research workload requiring advanced multimodal reasoning over large context windows with unpredictable usage spikes.\n\nYou need to minimize total operational expenditure and satisfy data governance requirements while meeting latency and capability needs across both workloads. What should you do?","opts":[{"id":"A","text":"Configure the managed Gemini API on Agent Platform for both workloads, enforcing VPC Service Controls and zero data retention to process all extraction and research requests.","correct":false},{"id":"B","text":"Deploy an open-weight Gemma model on Google Kubernetes Engine (GKE) in a private VPC for the 24/7 data extraction pipeline, and use the managed Gemini API on Agent Platform for the intermittent multimodal research workload.","correct":true},{"id":"C","text":"Use the managed Gemini API on Agent Platform for the 24/7 data extraction pipeline, and deploy an open-weight Gemma model on dedicated Google Kubernetes Engine (GKE) GPU nodes for the intermittent multimodal research workload.","correct":false},{"id":"D","text":"Deploy open-weight Gemma models on self-hosted Compute Engine GPU instances using Dynamic Workload Scheduler for both the 24/7 data extraction pipeline and the intermittent multimodal research workload.","correct":false}],"answers":["B"]},{"id":46,"text":"You manage an agent built using Agent Development Kit (ADK) that has six tools. You discover that the 95th percentile response time of the agent doubled in the last 7 days. Dashboards show the increased time but not its source. One of the six tools calls an internal pricing service that is maintained by another team in your organization. That service reports its own internal timings to the same observability backend, preserving the caller’s request context.\n\nYou need to identify the step that accounts for the added time, including any work performed inside the pricing service. What should you do?","opts":[{"id":"A","text":"Correlate the agent and pricing service logs in Cloud Logging by trace identifier.","correct":false},{"id":"B","text":"Compare the gen_ai.tool.execution.duration metric for the tools in Cloud Monitoring.","correct":false},{"id":"C","text":"Read the agent’s OpenTelemetry traces in Cloud Trace as a span waterfall.","correct":true},{"id":"D","text":"Enable Cloud Profiler for the agent service.","correct":false}],"answers":["C"]},{"id":47,"text":"You have deployed a custom multistep financial agent on Cloud Run. The agent sequentially queries a Vector Search index, calls an external stock market API, and uses a Gemini LLM to synthesize an answer. In production, you discover that responses experience intermittent latency spikes. You need to identify which step of the agent’s execution workflow is causing the bottleneck. What should you do?","opts":[{"id":"A","text":"Instrument the ADK agent with OpenTelemetry to export distributed traces to Cloud Trace, and analyze the individual trace spans.","correct":true},{"id":"B","text":"Query Cloud Logging for the Cloud Run service, and aggregate the httpRequest.latency field to calculate the average response time of the agent.","correct":false},{"id":"C","text":"Configure the gen AI evaluation service to execute a batch latency test against a golden dataset to find the slowest prompt.","correct":false},{"id":"D","text":"Enable Model Monitoring on the deployed agent to track prediction latency anomalies and feature drift across the LLM.","correct":false}],"answers":["A"]},{"id":48,"text":"You are evaluating a multitool customer support agent. In CI/CD, you discover that live API data changes trigger unpredictable test failures, making it difficult to detect regressions in reasoning trajectories or tool selection. You need to improve evaluation reliability in CI/CD and accurately validate the agent’s behavior independently of live backend data shifts. What should you do?","opts":[{"id":"A","text":"Create mock tool cassettes to replay recorded API responses during test execution. Evaluate the agent’s multistep tool call sequence using trajectory metrics in the gen AI evaluation service.","correct":true},{"id":"B","text":"Deploy a fine-tuned Gemini model to simulate external API responses at runtime, and evaluate agent responses against live production endpoints using exact string matching.","correct":false},{"id":"C","text":"Fetch real-time API responses into BigQuery before each test run, and dynamically update expected ground-truth answers in the golden dataset.","correct":false},{"id":"D","text":"Configure exponential backoff retry policies, and increase timeout thresholds for live API calls during dataset evaluation runs in the gen AI evaluation service.","correct":false}],"answers":["A"]},{"id":49,"text":"You are architecting a continuous evaluation pipeline for an autonomous agent deployed on Agent Runtime. The agent uses multiple valid, non-linear sequences of function calls to resolve user requests instead of using hardcoded golden trajectories. You want to continuously assess the semantic validity of tool selection and parameter generation without using hardcoded reference files. What should you do?","opts":[{"id":"A","text":"Configure the pipeline to use custom function metrics in the gen AI evaluation service.","correct":false},{"id":"B","text":"Configure the pipeline to use the managed types.RubricMetric.TOOL_USE_QUALITY metric in the gen AI evaluation service.","correct":true},{"id":"C","text":"Configure the pipeline to use the managed types.RubricMetric.FINAL_RESPONSE_QUALITY metric in the gen AI evaluation service.","correct":false},{"id":"D","text":"Export the agent’s intermediate tool calls to BigQuery, generate vector embeddings using the ML.GENERATE_EMBEDDING function, and execute the VECTOR_SEARCH command.","correct":false}],"answers":["B"]},{"id":50,"text":"You maintain a production customer support agent for an ecommerce company built using Agent Development Kit (ADK) and deployed to Agent Runtime. The agent coordinates tools to look up customer accounts, verify order statuses, and check warehouse inventory. You notice that intermittent requests take much longer than expected to return an answer. You need to identify the root cause for the increased latency using Google-recommended best practices. What should you do?","opts":[{"id":"A","text":"Enable distributed trace header propagation on Agent Gateway, and analyze upstream proxy latencies and client connection durations.","correct":false},{"id":"B","text":"Filter Cloud Trace by request latency, and inspect the breakdown of child spans for tool executions and model generation steps.","correct":true},{"id":"C","text":"Configure OpenTelemetry metric in the agent to export latency percentiles for individual tools to Cloud Monitoring.","correct":false},{"id":"D","text":"Export structured agent logs to BigQuery, and query the elapsed timestamps between tool invocation start and finish events.","correct":false}],"answers":["B"]},{"id":51,"text":"You are developing an automated evaluation benchmark suite for a multiturn enterprise support agent that interacts with dynamic backend tools. In your current CI/CD pipeline, static golden datasets frequently produce failure signals because live backend dependencies return changing state over time, while current evaluation prompts fail to assess tool-trajectory correctness, ambiguous user inputs, or API fault conditions. You need to ensure evaluation fidelity, ambiguity handling, and environment resilience. What should you do?","opts":[{"id":"A","text":"Use static simulated tool responses to decouple evaluation from dynamic backend state changes, and construct test sets in the gen AI evaluation service.","correct":true},{"id":"B","text":"Run trigger-based CI/CD pipelines, and trigger Cloud Monitoring alerts when LLM-as-a-judge response evaluation metrics fall below baseline thresholds during live tool calls.","correct":false},{"id":"C","text":"Replace the trigger-based CI/CD evaluation pipeline with an online LLM-as-a-judge mechanism that evaluates the live agent’s trajectory and outputs in production using continuous monitoring.","correct":false},{"id":"D","text":"Deploy automated human-in-the-loop review tasks using Agent Designer to evaluate expected outputs when backend API dependencies return variable tool states.","correct":false}],"answers":["A"]},{"id":52,"text":"You manage a support agent that uses RAG to provide answers based on a document corpus in RAG Engine. Each query retrieves the top 50 chunks. You are reviewing a set of failing questions, and determine that the chunk containing the answer is among the 50 returned but is ranked near the bottom, and the agent answers from a higher-ranked chunk instead.\n\nYou want the answering chunk to rank at the top without re-indexing the corpus. The retrieval step has 200 milliseconds of headroom. What should you do?","opts":[{"id":"A","text":"Update the RAG Engine deployment configuration from the Spanner mode Basic tier to the Scaled tier.","correct":false},{"id":"B","text":"Add the Agent Platform ranking API as the Agent Search reranker to reorder the chunks.","correct":true},{"id":"C","text":"Set a vector_distance_threshold on the RAG Engine retrieval configuration to return more relevant chunks.","correct":false},{"id":"D","text":"Add a reranker that calls a Gemini model to score each retrieved chunk, and reorder the chunks based on the user’s input.","correct":false}],"answers":["B"]},{"id":53,"text":"You are evaluating a policy question answering agent using an Agent Development Kit (ADK) eval set. Each case stores a single reference answer, and the ADK eval suite scores responses using the ADK response_match_score criterion. Reviewers have been asked to evaluate the agent’s responses and identify acceptable responses that cite the policy section and provide any exception that applies to the prompt. However, reviewers are unable to agree on which answer to store because several substantially different answers are acceptable.\n\nYou want ADK evaluations to assign a pass verdict to every response meeting both conditions and assign a fail verdict the rest. What should you do?","opts":[{"id":"A","text":"Store several reference answers in each ADK eval case.","correct":false},{"id":"B","text":"Lower the response_match_score threshold that the ADK eval set requires to pass.","correct":false},{"id":"C","text":"Score the cases using the ADK final_response_match_v2 criterion against the stored reference answer.","correct":false},{"id":"D","text":"Define evaluation rubrics, and score the responses using the ADK rubric_based_final_response_quality_v1 criterion.","correct":true}],"answers":["D"]},{"id":54,"text":"You are developing a custom customer service agent. You have compiled a golden dataset of historical user questions and their ideal answers. Before deploying the agent, you need to programmatically evaluate both the relevance of the retrieved documents and the groundedness of the agent’s generated responses. You want to minimize the use of custom evaluation code. What should you do?","opts":[{"id":"A","text":"Deploy the agent to Agent Runtime, run the agent against the golden dataset, and review the metrics using Google Cloud Observability.","correct":false},{"id":"B","text":"Execute the evaluation of the golden dataset against the agent using ADK eval set tooling, and configure LLM-based autorater metrics.","correct":true},{"id":"C","text":"Configure a continuous evaluation pipeline using the Agent Search ranking API to compare the semantic similarity between the agent’s generated response and the golden dataset’s ideal answer.","correct":false},{"id":"D","text":"Run a batch evaluation job against the agent using the golden dataset to calculate BLEU and ROUGE scores for the generated responses.","correct":false}],"answers":["B"]},{"id":55,"text":"You are designing a human-in-the-loop architecture for an enterprise agent built using Agent Development Kit (ADK) that executes high-risk business operations. You need to pause agent execution during sensitive tool invocations, present approval requests out-of-band without risk of prompt injection bypass, and reliably resume execution upon human confirmation. What should you do?","opts":[{"id":"A","text":"Configure policy interception using SecureRunner to emit confirmation requests, persist execution state using VertexAiSessionService, and require confirmation through a trusted UI component that returns the exact call ID to resume the session.","correct":true},{"id":"B","text":"Configure Agent Gateway using GatewayPolicyInterceptor to intercept tool payloads, log execution traces using CloudLoggingService, and allow the agent model to parse user natural language confirmation responses from the chat stream.","correct":false},{"id":"C","text":"Configure event notifications using PubSubEventBridge, persist pending execution state using a custom GcsStateStore, and deploy a Cloud Run function that evaluates user approvals using an LLM classification prompt to update the confirmation flag.","correct":false},{"id":"D","text":"Configure Model Armor security templates using FilterConfig to detect sensitive tool requests, pause agent containers using ContainerLifecycleManager, and resume execution when a user submits a natural language approval prompt.","correct":false}],"answers":["A"]},{"id":56,"text":"You are configuring a custom AI agent deployed in Gemini Enterprise and the Conversational Analytics API. The agent calls downstream enterprise tool APIs running in a separate Google Cloud project to retrieve restricted business analytics on behalf of the logged-in user. Currently, custom tool logic handles unmanaged raw OAuth 2.0 access tokens from execution context state, causing authorization failures during cross-project API calls when tokens expire and exposing raw long-lived credentials in custom tool code.\n\nYou need to establish a secure, managed identity propagation architecture between Gemini Enterprise and the downstream tool APIs. What should you do?","opts":[{"id":"A","text":"1. Generate a long-lived service account key in the downstream project, and pass the service account key JSON in the request payload.\n2. Grant the service account the roles/geminidataanalytics.dataAgentCreator IAM role hosting the Conversational Analytics API.","correct":false},{"id":"B","text":"1. Configure the tool execution calls to pass an OIDC Identity Token in a custom X-Goog-IAP-JWT-Assertion header.\n2. Grant the calling principal the roles/geminidataanalytics.dataAgentViewer IAM role on the downstream project hosting the Conversational Analytics API.","correct":false},{"id":"C","text":"1. Configure the tool execution calls to pass a standard Google OAuth 2.0 bearer token in the HTTP Authorization header.\n2. Grant the calling principal the roles/geminidataanalytics.dataAgentUser IAM role on the downstream project hosting the Conversational Analytics API.","correct":true},{"id":"D","text":"1. Implement tool execution calls to pass a signed OAuth 2.0 refresh token as an HTTP query parameter.\n2. Grant the calling principal the roles/geminidataanalytics.queryDataUser IAM role on the downstream project hosting the Conversational Analytics API.","correct":false}],"answers":["C"]},{"id":57,"text":"You are deploying an autonomous coding agent on Google Kubernetes Engine (GKE) to execute user-requested Python scripts. To isolate untrusted code execution, you enabled GKE Agent Sandbox using gVisor to intercept container system calls in user space. During a security audit, you discover that an untrusted Python script generated by a prompt injection attack successfully fetched IAM identity tokens by making an HTTP request to the link-local instance metadata server at 169.254.169.254.\n\nYou need to prevent sandboxed code from exfiltrating metadata tokens while maintaining container kernel isolation. What should you do?","opts":[{"id":"A","text":"Apply domain restrictions to the sandbox Pod.","correct":false},{"id":"B","text":"Apply a Kubernetes NetworkPolicy to the sandbox Pod that blocks egress traffic to 169.254.169.254.","correct":true},{"id":"C","text":"Apply a Kubernetes NetworkPolicy to the sandbox Pod that blocks ingress traffic to 169.254.169.254.","correct":false},{"id":"D","text":"Reconfigure the gVisor Sentry process to disable the execve system call for child Python processes.","correct":false}],"answers":["B"]},{"id":58,"text":"You are architecting an enterprise multiagent procurement system in Google Cloud. An orchestrator agent processes vendor purchase orders, retrieves contract terms, and invokes downstream tools. Your organization’s security policies require you to stop adversarial prompt injection found in vendor documents, and high-risk financial actions must receive explicit compliance officer authorization before execution. How should you address these requirements?","opts":[{"id":"A","text":"Configure Model Armor baseline harm category filters in Model Garden, and implement prompt rules directing the model to ignore embedded commands.","correct":false},{"id":"B","text":"Configure Model Armor post-execution log sink filters in Cloud Logging, and implement a Cloud Run functions webhook to notify compliance officers after transaction completion.","correct":false},{"id":"C","text":"Configure Model Armor security templates on downstream tool invocation outputs, and implement an asynchronous Workflows execution logic with a human-approval step using a persistent database.","correct":false},{"id":"D","text":"Configure Model Armor security templates at Agent Gateway for dynamic payload inspection, and implement human-in-the-loop approval policies on tools.","correct":true}],"answers":["D"]},{"id":59,"text":"You are designing a secure, multiagent framework on Gemini Enterprise Agent Platform. An administrative assistant agent requires access to internal corporate wikis and external communication APIs to synthesize daily updates and draft emails.\n\nYou need to establish a security architecture that is integrated with Agent Gateway to protect against indirect prompt injections and data exfiltration. You want this framework to perform real-time scanning of user input prompts and retrieved message content, while enforcing an explicit authorization boundary for critical, state-modifying operations. What should you do?","opts":[{"id":"A","text":"Configure Model Armor templates to scan ingress prompts and egress responses, and implement human-in-the-loop approval policies for mutating API execution flows.","correct":true},{"id":"B","text":"Configure Model Armor to perform network-level packet filtering and IP address blocking at the Agent Gateway ingress subnet, and schedule daily offline Model Armor batch jobs to sanitize prompt histories stored in backend databases.","correct":false},{"id":"C","text":"Create VPC Service Controls perimeter configurations around the Agent Gateway, and apply IAM Conditions to restrict backend API access permissions based on temporal context.","correct":false},{"id":"D","text":"Configure Model Armor templates on the Agent Gateway to scan ingress prompts only, and assign resource-level IAM roles to authorize downstream API tool executions.","correct":false}],"answers":["A"]},{"id":60,"text":"You are building a customer support agent. To comply with corporate governance policies, you must ensure that the agent never exposes users’ personally identifiable information (PII) in its responses. You want to enforce these guardrails without modifying the agent’s core app code. How should you configure this governance?","opts":[{"id":"A","text":"Configure an Agent Gateway routing rule to intercept traffic and route the traffic through a custom Cloud Run webhook that performs regex string matching for PII.","correct":false},{"id":"B","text":"Deploy the agent within a VPC Service Controls perimeter, and configure an egress rule that drops HTTP responses containing PII payloads.","correct":false},{"id":"C","text":"Create a Model Armor policy configured with Sensitive Data Protection, and attach this policy to the agent’s configuration.","correct":true},{"id":"D","text":"Update the agent’s system prompt with strict negative instructions forbidding the generation of PII.","correct":false}],"answers":["C"]},{"id":61,"text":"You are architecting the enterprise governance and observability layer for a distributed multiagent deployment in Google Cloud. You want autonomous subagents to communicate across microservices and external capability servers using agentic communication protocols. You need to implement a solution to meet the following compliance controls:\n\n•Provide unified visibility to catalog active agent instances.\n\n•Capture protocol interaction payloads for compliance auditing.\n\n•Monitor interagent communication traffic without requiring code modifications to individual agent services.\n\nHow should you design the solution?","opts":[{"id":"A","text":"Deploy Agent Gateway as a unified management proxy to track agent endpoints and record interservice exchange payloads.","correct":true},{"id":"B","text":"Deploy Agent Gateway as an egress-only web proxy to inspect outbound internet endpoints and validate external domain service queries.","correct":false},{"id":"C","text":"Deploy Apigee API Gateway with message logging policies to manage agent endpoints and capture outbound API payload traffic.","correct":false},{"id":"D","text":"Configure Cloud Service Mesh with egress-only L7 policies to inspect outbound internet endpoints and validate external domain service queries for authorized agent traffic.","correct":false}],"answers":["A"]},{"id":62,"text":"You are deploying an enterprise conversational agent in Google Cloud that connects to sensitive human resources (HR) databases. Your organization’s compliance policy mandates that all user queries and model completions must be filtered in real time to prevent prompt injection attacks, bl
